<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mallow · Test drive</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #1c1c1c; background: #fafaf7; }
      body { margin: 0; }
      header, footer { max-width: 44rem; margin: 0 auto; padding: 1.25rem 1rem; }
      header a { color: #2f7d4f; }
      main { max-width: 44rem; margin: 0 auto; padding: 1.25rem 1rem; }
      /* Intentional, for Impeccable's test drive: gradient text on the heading. */
      h1 {
        font-size: clamp(2rem, 6vw, 3.25rem);
        background: linear-gradient(90deg, #2f7d4f, #d6336c);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      /* Intentional, for Impeccable's test drive: low-contrast text, light grey on the page background. */
      .note { color: #c9c9c4; }
      /* Intentional, for Impeccable's test drive: link text under the 11px floor. */
      .small-link { font-size: 10px; color: #2f7d4f; }
      /* Intentional, for Impeccable's test drive: a layout property in a transition. */
      .bar { height: 0.5rem; width: 30%; background: #2f7d4f; transition: width 0.3s; }
      .bar:hover { width: 100%; }
      /* Intentional, for Impeccable's test drive: body text flush with the viewport edge, no background. */
      .edge { position: absolute; left: 0; right: 0; margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <header>
      <a href="/">Mallow</a>
    </header>
    <main>
      <h1>A quick tour of Mallow</h1>
      <p class="note">This page only exists to show Impeccable reviewing a change; nothing here is meant to ship.</p>
      <div class="bar"></div>
      <p><a class="small-link" href="/">Back to the shared list</a></p>
      <p class="edge">Mallow is the front door of this little test site: one calm page that reads the shared list and shows it back.</p>
    </main>
    <footer></footer>
  </body>
</html>
